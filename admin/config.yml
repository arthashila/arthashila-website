export default {
  async fetch(request, env) {
    const url = new URL(request.url);

    // Start GitHub OAuth
    if (url.pathname === "/auth") {
      const githubAuthUrl =
        "https://github.com/login/oauth/authorize" +
        `?client_id=${encodeURIComponent(env.GITHUB_CLIENT_ID)}` +
        `&redirect_uri=${encodeURIComponent(url.origin + "/callback")}` +
        `&scope=${encodeURIComponent("repo")}`;

      return Response.redirect(githubAuthUrl, 302);
    }

    // GitHub OAuth callback
    if (url.pathname === "/callback") {
      const code = url.searchParams.get("code");

      if (!code) {
        return new Response("Missing GitHub OAuth code.", {
          status: 400,
        });
      }

      const tokenResponse = await fetch(
        "https://github.com/login/oauth/access_token",
        {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            client_id: env.GITHUB_CLIENT_ID,
            client_secret: env.GITHUB_CLIENT_SECRET,
            code: code,
          }),
        }
      );

      const tokenData = await tokenResponse.json();

      if (!tokenData.access_token) {
        return new Response(
          `GitHub OAuth failed: ${JSON.stringify(tokenData)}`,
          { status: 400 }
        );
      }

      const html = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GitHub Authentication</title>
</head>
<body>
<script>
  if (window.opener) {
    window.opener.postMessage(
      "authorization:github:success:" +
      JSON.stringify({
        token: ${JSON.stringify(tokenData.access_token)},
        provider: "github"
      }),
      "*"
    );

    window.close();
  } else {
    document.body.innerText =
      "Authentication successful. You can close this window.";
  }
</script>
</body>
</html>
`;

      return new Response(html, {
        headers: {
          "Content-Type": "text/html; charset=UTF-8",
        },
      });
    }

    // Test / health check
    return new Response("Arthashila CMS Auth Worker is running.");
  },
};
